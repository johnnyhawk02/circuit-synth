<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Component-level synth prototype</title>
<style>
  :root { --bg:#f6f5f2; --fg:#1d1d1b; --muted:#6b6a66; --line:#d8d6d0; --accent:#c4532d; --cv:#3a6ea5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --fg:#ecebe7; --muted:#9a9993; --line:#33322f; --accent:#e8774f; --cv:#7aa7d9; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:820px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:20px; margin:0 0 4px; } p { color:var(--muted); margin:0 0 16px; }
  .controls { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:16px; }
  label { display:flex; flex-direction:column; font-size:13px; color:var(--muted); gap:4px; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:10px 18px; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  canvas { width:100%; height:220px; border:1px solid var(--line); border-radius:6px; display:block; margin-top:16px; }
  #status { font-variant-numeric:tabular-nums; color:var(--muted); margin-left:12px; }
  .legend span { display:inline-block; margin-right:16px; font-size:13px; color:var(--muted); }
  .legend i { display:inline-block; width:12px; height:3px; vertical-align:middle; margin-right:6px; }
</style>
</head>
<body>
<main>
  <h1>Component-level synth prototype</h1>
  <p>Sine → discrete BJT differential-pair VCA → op-amp mixer, with the VCA's CV coming from an op-amp integrator + Schmitt-trigger LFO. Every part after the sine is solved as a circuit (MNA + Newton-Raphson, 4x oversampled).</p>
  <div class="controls">
    <label>Tone <output id="toneV">220 Hz</output><input id="tone" type="range" min="55" max="880" value="220"></label>
    <label>LFO rate resistor <output id="rateV">100 kΩ</output><input id="rate" type="range" min="20" max="500" value="100"></label>
    <label>Input level (drives the pair into tanh) <output id="levelV">5.0 V</output><input id="level" type="range" min="0.5" max="10" step="0.5" value="5"></label>
    <label>Length <output id="secsV">3 s</output><input id="secs" type="range" min="1" max="8" value="3"></label>
  </div>
  <button id="go">Render &amp; play</button><span id="status"></span>
  <canvas id="scope" width="1640" height="440"></canvas>
  <div class="legend"><span><i style="background:var(--accent)"></i>audio out</span><span><i style="background:var(--cv)"></i>LFO → VCA CV (0–10.5 V)</span></div>
</main>
<script type="module">
const $ = id => document.getElementById(id);
const fmt = { tone: v => v + ' Hz', rate: v => v + ' kΩ  (≈ ' + (500 / v).toFixed(1) + ' Hz)', level: v => (+v).toFixed(1) + ' V', secs: v => v + ' s' };
for (const k in fmt) { const upd = () => $(k + 'V').textContent = fmt[k]($(k).value); $(k).oninput = upd; upd(); }
const sr = 48000;
let ctx;
$('go').onclick = () => {
  ctx ||= new AudioContext({ sampleRate: sr });
  $('go').disabled = true;
  const w = new Worker(new URL('./worker.js', import.meta.url), { type: 'module' });
  w.onmessage = e => {
    if (e.data.progress !== undefined) { $('status').textContent = 'Solving circuit… ' + Math.round(e.data.progress * 100) + '%'; return; }
    const { out, cv, ms } = e.data;
    $('status').textContent = `Solved ${$('secs').value} s in ${(ms / 1000).toFixed(1)} s`;
    draw(out, cv);
    const buf = ctx.createBuffer(1, out.length, sr); buf.copyToChannel(out, 0);
    const src = ctx.createBufferSource(); src.buffer = buf; src.connect(ctx.destination); src.start();
    src.onended = () => ($('go').disabled = false);
    w.terminate();
  };
  w.postMessage({ sampleRate: sr, seconds: +$('secs').value, toneHz: +$('tone').value, lfoRateOhms: $('rate').value * 1e3, inputVolts: +$('level').value });
};
function draw(out, cv) {
  const c = $('scope'), g = c.getContext('2d'), W = c.width, H = c.height, css = getComputedStyle(document.documentElement);
  g.clearRect(0, 0, W, H);
  const cols = W, per = out.length / cols;
  g.fillStyle = css.getPropertyValue('--accent');
  for (let x = 0; x < cols; x++) {
    let lo = 1, hi = -1;
    for (let i = Math.floor(x * per); i < Math.floor((x + 1) * per); i++) { lo = Math.min(lo, out[i]); hi = Math.max(hi, out[i]); }
    g.fillRect(x, H / 2 - hi * H / 2, 1, Math.max(1, (hi - lo) * H / 2));
  }
  g.strokeStyle = css.getPropertyValue('--cv'); g.lineWidth = 3; g.beginPath();
  for (let x = 0; x < cols; x++) { const v = cv[Math.floor(x * per)]; const y = H - 8 - v / 10.5 * (H - 16); x ? g.lineTo(x, y) : g.moveTo(x, y); }
  g.stroke();
}
</script>
</body>
</html>
